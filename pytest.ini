[pytest]
testpaths = interfaces/tests module_sg1/tests module_sg2/tests module_sg3/tests module_sg4/tests module_sg5/tests integration/tests evaluation/tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    jetson: requires the Jetson Orin Nano target (skipped on development PCs)
    slow: takes more than a few seconds
    needs_model: requires downloaded model weights
